

name: Badua coverage

on:
  push:
    branches: [ "ISW2" ]
  pull_request:
    branches: [ "ISW2" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Clone and build ba-dua
        run: |
          git clone https://www.github.com/saeg/ba-dua.git
          cd ba-dua
          git checkout tags/ba-dua-0.6.0 -b ba-dua-0.6.0
          mvn clean install
          cd ..

      - name: Build with badua
        run: mvn clean verify -P baduaci

      - name: Upload badua reports
        uses: actions/upload-artifact@v4
        with:
          name: badua-reports
          path: bookkeeper-server/target/badua.xml
          if-no-files-found: error